# ==========================================================================
# SITE REGISTRY
# ==========================================================================
# ats_type tells the scraper which extraction strategy to use:
#   greenhouse        -> job-boards.greenhouse.io / embedded greenhouse boards
#   workday            -> *.myworkdayjobs.com
#   oracle_cloud_hcm    -> *.fa.ocs.oraclecloud.com
#   zoho_recruit        -> *.zohorecruit.com / .in
#   darwinbox           -> *.darwinbox.in / .com
#   avature             -> *.avature.net
#   generic             -> falls back to config-driven CSS selectors below,
#                          which are BEST-GUESS DEFAULTS and MUST be verified
#                          with `python -m src.discover_selectors <site_id>`
#                          before you rely on them. See README "Tuning selectors".
#
# `active: true/false` lets you disable a broken/inactive site without
# deleting its config (per your "ignore inactive sites" requirement).
# ==========================================================================

defaults:
  wait_strategy: networkidle       # networkidle | load | domcontentloaded
  wait_timeout_ms: 45000
  extra_wait_ms: 2000              # settle time for client-side rendering
  retry_attempts: 3
  job_card_selector: "a[href*='job'], a[href*='career'], li[class*='job'], div[class*='job-card'], tr[class*='job']"
  title_selector: null             # null = use job_card text itself
  location_selector: null
  link_attr: "href"

roles:
  priority_keywords:
    - "data scientist"
    - "senior data scientist"
    - "machine learning engineer"
    - "ml engineer"
    - "ai engineer"
    - "applied scientist"
    - "research engineer"
    - "computer vision"
    - "deep learning"
    - "llm engineer"
    - "robotics engineer"
    - "autonomous systems"
    - "autonomous driving"
    - "perception"
    - "planning"
    - "localization"
    - "mapping"
    - "controls engineer"
    - "embedded ai"
    - "software engineer"
    - "software development engineer"
    - "sde"
    - "backend engineer"
    - "python engineer"
    - "c++"
    - "ros2"
    - "ros "
    - "data engineer"
    - "analytics engineer"
    - "decision scientist"
    - "mlops"
    - "simulation"
    - "optimization"
    - "algorithm engineer"
  include_keywords:
    - "early career product manager"
    - "associate product manager"
    - "apm"
    - "product manager i"
    - "product manager ii"
    - "product owner"
  exclude_keywords:
    - "human resources"
    - "hr business partner"
    - "sales executive"
    - "account executive"
    - "finance analyst"
    - "accounts payable"
    - "marketing manager"
    - "legal counsel"
    - "recruiter"
  experience_years: [3, 7]

locations:
  country_default: "India"
  preferred_cities:
    - "bangalore"
    - "bengaluru"
    - "hyderabad"
    - "chennai"
    - "pune"
    - "gurgaon"
    - "gurugram"
    - "noida"
    - "remote india"
    - "india"

